name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Landscape + fullscreen immersive
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<activity|<activity android:screenOrientation="sensorLandscape"|' "$MANIFEST"
          STYLES=android/app/src/main/res/values/styles.xml
          sed -i 's|<item name="android:background">@null</item>|<item name="android:background">@null</item><item name="android:windowFullscreen">true</item><item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>|' "$STYLES"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fanny-trainer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
