<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Cable Master</title>
<style>
:root{--bg:#12151a;--panel:#1a1e25;--panel2:#222831;--floor:#161a20;--grid:#1d222a;--wall:#323a47;--wallTop:#4b566a;--text:#e9ecf1;--muted:#8a93a3;--accent:#4fb3a9;--danger:#e0625a;--gold:#e2b04a;--player:#f2f4f8;--line:#2b323d;--ok:#5fb37c;--jb:128px;--cb:72px;--ub:88px;--jk:1;--ck:1;--uk:1;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eceff3;--panel:#ffffff;--panel2:#f1f3f7;--floor:#f7f8fa;--grid:#e8ebf0;--wall:#8a94a6;--wallTop:#b4bccb;--text:#1b2330;--muted:#657084;--accent:#1f8f85;--danger:#cf4a42;--gold:#b98312;--player:#1b2330;--line:#d6dbe4;--ok:#2f9a5c;color-scheme:light}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#app{height:100%;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* HUD */
#hud{display:flex;align-items:center;gap:18px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.st{display:flex;flex-direction:column;line-height:1.1}
.st small{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.st b{font-size:20px;font-weight:600}
#hud .sp{flex:1}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 8px;font-weight:600;font-size:15px}
.pill svg{width:16px;height:16px}
.pill.pop{animation:pop .3s}@keyframes pop{50%{transform:scale(1.12)}}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;justify-content:center;padding:0}
.ibtn:active{background:var(--grid)}

/* Stage */
#stage{flex:1;min-height:0;position:relative}
canvas#cv{position:absolute;inset:0;width:100%;height:100%}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,12,16,.66);padding:16px}
#card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px 22px 20px;width:min(340px,100%);text-align:center;box-shadow:0 12px 36px rgba(0,0,0,.28)}
#card h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.2px}
#sub{margin:4px 0 0;color:var(--muted);font-size:14px}
#nb{display:inline-block;margin-top:10px;padding:2px 10px;border-radius:999px;background:var(--accent);color:var(--bg);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
#stats{display:flex;margin:18px 0 20px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
#stats .stat{flex:1;padding:10px 4px;background:var(--panel2)}
#stats .stat+.stat{border-left:1px solid var(--line)}
#stats small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
#stats b{display:block;margin-top:2px;font-size:20px;font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:16px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root:not([data-theme="light"]) .btn.pri{color:#0c1614}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.pri{color:#fff}}
.btn.sec{margin-top:10px}
.btn:active{filter:brightness(.92)}
.btn:focus-visible,.ibtn:focus-visible,.skill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:16px;height:16px}

/* Controls */
#pad{min-height:min(190px,34vh);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 22px;background:var(--panel);border-top:1px solid var(--line)}
#joy{width:calc(var(--jb)*var(--jk));height:calc(var(--jb)*var(--jk));border-radius:50%;border:1.5px solid var(--line);position:relative;flex:none;background:var(--panel2)}
#knob{position:absolute;left:50%;top:50%;width:calc(var(--jb)*var(--jk)*.4);height:calc(var(--jb)*var(--jk)*.4);margin:calc(var(--jb)*var(--jk)*-.2) 0 0 calc(var(--jb)*var(--jk)*-.2);border-radius:50%;background:var(--muted);opacity:.7}
#en{flex:1;max-width:240px;min-width:90px}
#en .lbl{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--muted);margin-bottom:6px}
#bar{height:8px;border-radius:4px;background:var(--grid);overflow:hidden}
#fill{height:100%;width:100%;background:var(--ok);border-radius:4px;transition:width .15s}
#skills{display:flex;align-items:flex-end;gap:14px;flex:none}
.skill{position:relative;border-radius:50%;border:1.5px solid var(--line);background:var(--panel2);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0;touch-action:none;color:var(--text)}
.skill svg{width:42%;height:42%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1}
#cab{--sz:calc(var(--cb)*var(--ck));width:var(--sz);height:var(--sz);border-color:var(--accent);color:var(--accent)}
#ult{--sz:calc(var(--ub)*var(--uk));width:var(--sz);height:var(--sz);border-color:var(--danger);color:var(--danger)}
.skill .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.45);pointer-events:none;z-index:2}
.skill.low{opacity:.6}
@media (max-height:480px){:root{--jb:104px;--cb:60px;--ub:74px}#hud{padding:4px 14px}.st b{font-size:17px}}
@media (max-width:560px){#hud{gap:9px;padding:6px 10px}.st b{font-size:17px}.ibtn{width:32px;height:32px}.pill{padding:3px 9px 3px 6px;font-size:14px}}
body.ov #pad{position:absolute;left:0;right:0;bottom:0;background:transparent;border:0;pointer-events:none}
body.ov #pad>*{pointer-events:auto}
body.ov #skills{pointer-events:none}
body.ov #skills>*{pointer-events:auto}
body.edit .ed{outline:2px dashed var(--accent);outline-offset:3px;cursor:move}
body.edit .ed.sel{outline:2px solid var(--accent)}

/* Settings */
#sheet{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 44px);left:50%;transform:translateX(-50%);width:min(340px,94vw);max-height:calc(100vh - 56px);max-height:calc(100dvh - 56px);overflow-y:scroll;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:thin;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 16px 14px;box-shadow:0 12px 36px rgba(0,0,0,.35);font-size:15px}
#sheet *{touch-action:pan-y}
#sheet .sh{position:sticky;top:-10px;z-index:2;background:var(--panel);padding:8px 0;margin-top:-4px;display:flex;justify-content:space-between;align-items:center;font-size:17px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:8px 0;font-size:14px}
.row output{color:var(--accent);font-weight:600}
.row .trk{grid-column:1/3;padding:8px 0;cursor:pointer}
.row input[type=range]{display:block;width:100%;margin:0;pointer-events:none;accent-color:var(--accent)}
.row.chk{display:flex;gap:10px;align-items:center}
.row.chk input{accent-color:var(--accent);width:18px;height:18px;flex:none}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btns button,#sclose,#edone,#epanel button{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:14px;font-weight:500}
.hint{color:var(--muted);font-size:12px;margin:10px 0 0}
#editbar{position:fixed;z-index:61;top:calc(env(safe-area-inset-top,0px) + 6px);left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:6px 12px;font-size:14px;white-space:nowrap}
#epanel{position:fixed;z-index:62;top:calc(env(safe-area-inset-top,0px) + 50px);left:50%;transform:translateX(-50%);width:min(320px,92vw);background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:8px 14px}
#epanel .eh{display:flex;justify-content:space-between;align-items:center;font-size:16px}

/* Shop */
#shop{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#shop header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#shop header h2{margin:0;font-size:18px;font-weight:700;flex:1;text-align:center}
#shop header .ibtn,#shop header .pill{min-width:36px}
#shop .spacer{width:72px}
#sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:14px}
#sbody *{touch-action:pan-y}
#sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:720px;margin:0 auto}
.sk{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px}
.sk{box-shadow:inset 0 3px 0 var(--tc,transparent)}
.sk.on{border-color:var(--accent)}
.th{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.th:first-child{margin-top:0}
.th i{width:8px;height:8px;border-radius:50%;flex:none}
.th small{font-weight:500;letter-spacing:.02em;text-transform:none}
.sk canvas{width:100%;height:64px;border-radius:8px;background:var(--floor);border:1px solid var(--line);margin-bottom:4px}
.sk .nm{font-size:15px;font-weight:600}
.sk .ds{font-size:12px;color:var(--muted);min-height:30px;line-height:1.25}
.sk .btn{padding:8px 10px;font-size:14px;margin-top:4px;border-radius:10px}
.sk .btn.buy{background:var(--accent);border-color:var(--accent);color:#0c1614}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .sk .btn.buy{color:#fff}}
.sk .btn.buy.lock{background:var(--panel2);border-color:var(--line);color:var(--muted)}
.sk .btn.eqd{background:transparent;color:var(--accent);border-color:var(--accent)}
</style></head><body>
<div id="app">
 <div id="hud">
  <div class="st"><small>Score</small><b id="sc">0</b></div>
  <div class="st"><small>Best</small><b id="bs">0</b></div>
  <div class="st"><small>Streak</small><b id="stk">0</b></div>
  <div class="st"><small>Max</small><b id="mx">0</b></div>
  <div class="sp"></div>
  <div class="pill" id="coinui"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#e2b04a"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#a97c1f" stroke-width="1.6"/></svg><b id="cn">0</b></div>
  <button id="hshop" class="ibtn" aria-label="Shop"><svg class="i" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></button>
  <button id="gear" class="ibtn" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/></svg></button>
 </div>
 <div id="stage"><canvas id="cv"></canvas>
  <div id="overlay"><div id="card">
   <h1 id="ttl">Cable Master</h1>
   <p id="sub">Swing, slash, repeat.</p>
   <span id="nb" hidden>New best</span>
   <div id="stats"></div>
   <button id="start" class="btn pri">Play</button>
   <button id="shopbtn" class="btn sec">Shop</button>
  </div></div>
 </div>
 <div id="pad">
  <div id="joy"><div id="knob"></div></div>
  <div id="en"><div class="lbl"><span>HP</span><span id="enT">100</span></div><div id="bar"><div id="fill"></div></div></div>
  <div id="skills">
   <button class="skill" id="cab" aria-label="Steel Cables"><svg viewBox="0 0 24 24"><rect x="3.5" y="12" width="11" height="6" rx="3" transform="rotate(-45 9 15)"/><rect x="9.5" y="6" width="11" height="6" rx="3" transform="rotate(-45 15 9)"/></svg><div class="cd"></div></button>
   <button class="skill" id="ult" aria-label="Cut Throat"><svg viewBox="0 0 24 24"><path d="M5 20l6-15M10 21l6-15M15 21l5-12"/></svg><div class="cd"></div></button>
  </div>
 </div>
 <div id="shop" hidden>
  <header><button id="sback" class="ibtn" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2>Cable Skins</h2><div class="pill" id="shopcoin"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#e2b04a"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#a97c1f" stroke-width="1.6"/></svg><b id="scoins">0</b></div></header>
  <div id="sbody"><div id="sgrid"></div></div>
 </div>
</div>
<div id="sheet" hidden>
 <div class="sh"><b>Settings</b><button id="sclose">Close</button></div>
 <div id="rows"></div>
 <label class="row chk"><input type="checkbox" id="noobchk"><span>Remove obstacles (only the arena walls remain)</span></label>
 <label class="row chk"><input type="checkbox" id="noenchk"><span>Remove enemies (no red drifters, no shooting targets)</span></label>
 <label class="row chk"><input type="checkbox" id="vibchk"><span>Vibration on cable and kill (off by default)</span></label>
 <label class="row chk"><input type="checkbox" id="ovchk"><span>Overlay controls on the arena (hides the bottom bar)</span></label>
 <div class="btns"><button id="sedit">Edit UI</button><button id="sall">Reset all</button></div>
 <p class="hint">Saved on this device. The game is paused while this is open.</p>
</div>
<div id="editbar" hidden><span>Drag a control to move it, tap it to adjust</span><button id="edone">Done</button></div>
<div id="epanel" hidden><div class="eh"><b id="ename"></b><button id="ereset">Reset</button></div><div id="erows"></div></div>
<script>
// Matched to Fanny where sources exist: move speed 265, Steel Cable cost 14 (1 less per recast within 5s, no cooldown), Cut Throat 12 energy and 25s cooldown. Cable speed, range and energy regen are estimates.
const CFG={W:1000,H:600,R:14,speed:265,eMax:100,regen:8,
 cable:{cost:14,step:1,window:5,range:1300,speed:700,hook:2000,cd:0,boost:.69,more:.33,dummy:3},
 cut:{cost:12,range:240,cd:25,speed:1500,dmg:70,mark:.3},
 t1:{cost:8,cd:1.5,refund:6,r:110},
 time:60,hp:100,comboWindow:2.5};
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let C={},sc=1,ox=0,oy=0,dpr=1,cw=0,ch=0;
function theme(){const s=getComputedStyle(document.documentElement);['floor','grid','wall','wallTop','accent','danger','gold','player','text','muted'].forEach(k=>C[k]=s.getPropertyValue('--'+k).trim())}
theme();matchMedia('(prefers-color-scheme:light)').addEventListener('change',theme);
function resize(){const r=cv.getBoundingClientRect();dpr=devicePixelRatio||1;cw=r.width;ch=r.height;cv.width=cw*dpr;cv.height=ch*dpr;sc=Math.min(cw/CFG.W,ch/CFG.H)*.97;ox=(cw-CFG.W*sc)/2;oy=(ch-CFG.H*sc)/2}
addEventListener('resize',resize);resize();

const S={mode:'static',phase:'menu',paused:false,score:0,time:CFG.time,kills:0,best:0,bs:0,ms:0,coins:0};
try{S.best=+localStorage.getItem('fannyBest')||0;S.coins=+localStorage.getItem('cableMasterCoins')||0;S.ms=+localStorage.getItem('cableMasterMaxStreak')||0}catch(e){}
let P,T,obs=[],haz=[],dash=null,cabs=[],stuck=0,rem=0,vdx=0,vdy=0,fx=[],php,cdC=0,cdU=0,lastCable=-9,chain=0,lastC=-99,now=0,aim=null,cLine=null,inv=0,fl=null,flN=0,tor=[],t1cd=0;
// Target types: hp = hits to kill, pts = base points, sp = speed multiplier. Streak = consecutive kills without a drifter hit or stopping.
let streak=0,idle=0,sw=null,proj=[];const buzz=n=>{if(!cfg.vib)return;try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
// Rarity tiers: Common is the baseline. hp = hits to kill, pts = score, coin = coins dropped, w = spawn weight.
const TY=[{n:'Common',hp:1,r:CFG.R,pts:1,coin:1,col:'#e8c15a',sp:1,w:55},{n:'Rare',hp:3,r:CFG.R,pts:3,coin:3,col:'#5b9bd5',sp:1,w:28},{n:'Epic',hp:5,r:CFG.R,pts:5,coin:6,col:'#9b7fd1',sp:1,w:13},{n:'Legendary',hp:8,r:CFG.R,pts:8,coin:12,col:'#e08a4a',sp:1,w:4},{n:'Mythic',hp:5,r:CFG.R,pts:6,coin:10,col:'#d9689a',sp:1,w:6,shoots:true}];
function pickTy(){const L=cfg.noen?TY.filter(t=>!t.shoots):TY;let q=Math.random()*L.reduce((a,t)=>a+t.w,0);for(const t of L){if((q-=t.w)<0)return t}return L[0]}
const joy={x:0,y:0},keys={};let mouse=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const norm=(x,y)=>{const l=Math.hypot(x,y)||1;return [x/l,y/l]};

// ---- Cable skins (shop) ----
// fx is drawn statelessly from time, so the same code renders the shop previews and the live cables.
const TIERS=[{id:'normal',n:'Normal',note:'Color only',col:'#8a9bb0'},{id:'elite',n:'Elite',col:'#4a9fe0'},{id:'epic',n:'Epic',col:'#9b7fd1'},{id:'legendary',n:'Legendary',col:'#e08a4a'},{id:'mythic',n:'Mythic',col:'#d9689a'}];
const SKINS=[
 {id:'classic',t:'normal',n:'Classic',desc:'Steel gray.',price:0,col:'#8a9bb0'},
 {id:'crimson',t:'normal',n:'Crimson',desc:'Deep red.',price:80,col:'#d9534f'},
 {id:'azure',t:'normal',n:'Azure',desc:'Clear blue.',price:80,col:'#4a9fe0'},
 {id:'moss',t:'normal',n:'Moss',desc:'Forest green.',price:80,col:'#6ab36a'},
 {id:'amber',t:'normal',n:'Amber',desc:'Warm yellow.',price:80,col:'#e0a63a'},
 {id:'ember',t:'elite',n:'Ember',desc:'Glowing line with rising sparks.',price:250,col:'#e8823a',fx:'ember'},
 {id:'frost',t:'elite',n:'Frost',desc:'Pale ice with twinkling crystals.',price:250,col:'#9fd3ee',fx:'frost'},
 {id:'jade',t:'epic',n:'Jade',desc:'Flowing, wavy green cable.',price:500,col:'#3fb985',fx:'wave'},
 {id:'sunset',t:'epic',n:'Sunset',desc:'Rose to amber gradient with soft glow.',price:500,col:'#ee6f88',col2:'#f4a940',fx:'grad'},
 {id:'royal',t:'legendary',n:'Royal',desc:'Braided gold with a travelling shimmer.',price:1000,col:'#e3b94f',fx:'royal'},
 {id:'aurora',t:'legendary',n:'Aurora',desc:'Slowly shifting colors with a soft glow.',price:1000,col:'#6fd0c0',fx:'aurora'},
 {id:'phoenix',t:'mythic',n:'Phoenix',desc:'Twin flames, wide glow and rising embers.',price:2000,col:'#e0502c',col2:'#ffc24a',fx:'phoenix'},
 {id:'celestia',t:'mythic',n:'Celestia',desc:'Pearl and gold strands, stars and shimmer.',price:2000,col:'#f1d98a',fx:'celestia'}];
const skinById=id=>SKINS.find(s=>s.id===id);
let SK={owned:['classic'],eq:'classic'};
try{const o=JSON.parse(localStorage.getItem('cableMasterSkins')||'null');
 if(o&&Array.isArray(o.owned)){SK.owned=o.owned.filter(id=>skinById(id));if(!SK.owned.includes('classic'))SK.owned.unshift('classic');if(skinById(o.eq)&&SK.owned.includes(o.eq))SK.eq=o.eq}}catch(e){}
const saveSK=()=>{try{localStorage.setItem('cableMasterSkins',JSON.stringify(SK))}catch(e){}};
const curSkin=()=>skinById(SK.eq)||SKINS[0];
function drawCable(g,x0,y0,x1,y1,sk,a,t,w){
 const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,n=clamp(Math.round(L/28),3,22),fx=sk.fx;
 g.save();g.lineCap='round';g.lineJoin='round';
 const ln=(col,lw,al)=>{g.globalAlpha=a*al;g.strokeStyle=col;g.lineWidth=lw;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke()};
 const pt=(s,o)=>[x0+dx*s+nx*o,y0+dy*s+ny*o];

function resolve(o,r){let hit=false;
 const W=CFG.W,H=CFG.H;
 if(o.x<r){o.x=r;hit=true}if(o.x>W-r){o.x=W-r;hit=true}if(o.y<r){o.y=r;hit=true}if(o.y>H-r){o.y=H-r;hit=true}
 for(const b of obs){const cx=clamp(o.x,b.x,b.x+b.w),cy=clamp(o.y,b.y,b.y+b.h);let dx=o.x-cx,dy=o.y-cy,d=Math.hypot(dx,dy);
  if(d<r){hit=true;if(d>0){o.x=cx+dx/d*r;o.y=cy+dy/d*r}else{const l=o.x-b.x,rr=b.x+b.w-o.x,t=o.y-b.y,bt=b.y+b.h-o.y,m=Math.min(l,rr,t,bt);
   if(m===l)o.x=b.x-r;else if(m===rr)o.x=b.x+b.w+r;else if(m===t)o.y=b.y-r;else o.y=b.y+b.h+r}}}
 return hit}
function inObs(x,y,m){return obs.some(b=>x>b.x-m&&x<b.x+b.w+m&&y>b.y-m&&y<b.y+b.h+m)}
function makeObs(){obs=[];if(cfg.noobs)return;const n=5+Math.floor(Math.random()*3);
 for(let i=0,t=0;i<n&&t<200;t++){const w=rnd(50,150),h=rnd(36,120),x=rnd(60,CFG.W-w-60),y=rnd(50,CFG.H-h-50);
  const b={x,y,w,h};if(Math.hypot(x+w/2-P.x,y+h/2-P.y)<Math.max(w,h)/2+90)continue;
  if(obs.some(o=>x<o.x+o.w+40&&x+w+40>o.x&&y<o.y+o.h+40&&y+h+40>o.y))continue;obs.push(b);i++}}
function makeHaz(){haz=[];if(cfg.noen)return;for(let i=0;i<3;i++){let x,y,k=0;do{x=rnd(40,CFG.W-40);y=rnd(40,CFG.H-40)}while((inObs(x,y,20)||Math.hypot(x-P.x,y-P.y)<200)&&k++<80);
 const a=rnd(0,6.28);haz.push({x,y,r:12,vx:Math.cos(a)*65,vy:Math.sin(a)*65})}}
function spawnT(){let x,y,k=0;do{x=rnd(40,CFG.W-40);y=rnd(40,CFG.H-40)}while((inObs(x,y,24)||Math.hypot(x-P.x,y-P.y)<260)&&k++<150);
 const a=rnd(0,6.28),moving=Math.random()<.5,ty=pickTy(),v=moving?(85+S.kills*4)*ty.sp:0;
 T={x,y,r:ty.r,hp:ty.hp,max:ty.hp,pts:ty.pts,coin:ty.coin,n:ty.n,col:ty.col,shoots:!!ty.shoots,fire:1.5,hit:0,moving,vx:Math.cos(a)*v,vy:Math.sin(a)*v,born:now,marks:0}}
function bounce(o,dt){let nx=o.x+o.vx*dt;const t={x:nx,y:o.y};if(resolve({x:nx,y:o.y},o.r)&&(nx!==clamp(nx,o.r,CFG.W-o.r)||obs.some(b=>Math.hypot(clamp(nx,b.x,b.x+b.w)-nx,clamp(o.y,b.y,b.y+b.h)-o.y)<o.r)))o.vx=-o.vx;else o.x=nx;
 let ny=o.y+o.vy*dt;if(ny<o.r||ny>CFG.H-o.r||obs.some(b=>Math.hypot(clamp(o.x,b.x,b.x+b.w)-o.x,clamp(ny,b.y,b.y+b.h)-ny)<o.r))o.vy=-o.vy;else o.y=ny}

function rayHit(dx,dy,range){for(let d=6;d<=range;d+=4){const px=P.x+dx*d,py=P.y+dy*d;
  if(px<=2||py<=2||px>=CFG.W-2||py>=CFG.H-2||inObs(px,py,1))return{x:px,y:py,d,hero:false}}return null}

 const h=rayHit(dx,dy,CFG.cable.range);
 if(!h){cLine={x1:P.x,y1:P.y,x2:P.x+dx*CFG.cable.range,y2:P.y+dy*CFG.cable.range,t:.18,miss:true};say(P.x,P.y-24,'Miss',C.danger);return}
 const L=h.d-(P.r+2);if(L<2){say(P.x,P.y-24,'Too close',C.danger);return}
 cabs.push({ax:h.x,ay:h.y,ox:P.x,oy:P.y,dx,dy,hd:h.d,t:0,att:false,r:0});if(cabs.length>40)cabs.shift()}
function cut(dir){if(S.phase!=='play'||S.paused||dash||cdU>0)return;
 const d=Math.hypot(T.x-P.x,T.y-P.y);
 if(d<=CFG.cut.range){cdU=CFG.cut.cd;endFlight();const [dx,dy]=norm(T.x-P.x,T.y-P.y);P.fx=dx;P.fy=dy;const back=P.r+T.r-2;
  dash={sx:P.x,sy:P.y,tx:T.x-dx*back,ty:T.y-dy*back,speed:CFG.cut.speed,kind:'cut',hit:true}}
 else say(P.x,P.y-24,'No target in range',C.danger)}
function autoDir(){return Math.hypot(joy.x,joy.y)>.3?norm(joy.x,joy.y):norm(T.x-P.x,T.y-P.y)}
// Cut Throat lands 3 hits when the dash arrives.
function arrive(){P.x=dash.tx;P.y=dash.ty;const k=dash.kind;dash=null;if(k==='cut')hitT(3,false)}
// Speed from the video's timer test (same distance, same direction): 1 cable 2.04s, 2 cables 1.21s, 3 cables 1.06s, i.e. x1, x1.69, x1.92. The pair gives 1+boost*(sm-1); each cable after the 2nd adds a shrinking extra (ratio 'more'). Aligned cables (sm near 2) get the full effect.
function extraBoost(sm){let e=0,r=CFG.cable.more;for(let i=3;i<=flN;i++){e+=CFG.cable.boost*Math.pow(r,i-2)}return e*Math.max(0,sm-1)}
// Grappling hook: the hook travels out first, then anchors at the wall hit. Active anchors are a FIFO queue of 2: a 3rd attach drops the oldest.
function attach(c){const d=Math.hypot(c.ax-P.x,c.ay-P.y);
 if(d<P.r+4){c.dead=true;return}
 c.att=true;flN++;
 const at=cabs.filter(k=>k.att&&!k.dead&&!k.dummy);
 while(at.length>2){const o=at.shift();o.dummy=true;o.dt=0}
 fl={boost:1,side:0,deg:true,t:0};
 if(at.length>1){const p1=at[0],p2=at[1],u=norm(p1.ax-P.x,p1.ay-P.y),v=norm(p2.ax-P.x,p2.ay-P.y),sm=Math.hypot(u[0]+v[0],u[1]+v[1]);
  const ex=p2.ax-p1.ax,ey=p2.ay-p1.ay,len=Math.hypot(ex,ey),sd=ex*(P.y-p1.ay)-ey*(P.x-p1.ax);
  fl={boost:1+CFG.cable.boost*(sm-1)+extraBoost(sm),side:Math.sign(sd),deg:len<6||Math.abs(sd)/len<3,dot0:u[0]*v[0]+u[1]*v[1],crossed:false,dx:(u[0]+v[0])/(sm||1),dy:(u[1]+v[1])/(sm||1),t:0}}}
function endFlight(){cabs=cabs.filter(c=>!c.att);fl=null;flN=0}
function hooks(dt){for(const c of cabs)if(c.dummy){c.dt+=dt;if(c.dt>CFG.cable.dummy)c.dead=true}
 for(const c of cabs)if(!c.att&&!c.dead){c.t+=CFG.cable.hook*dt;if(c.t>=c.hd)attach(c)}cabs=cabs.filter(c=>!c.dead)}
// Cable flight. One anchor: pull straight at it and stop there. Two anchors: fly in a straight line along the bisector of the two cables, fixed at the moment the pair forms (even if the cables are uneven), and detach once she has crossed the line P1-P2 and the angle between the cables is back to its entry value. Narrower entry angle means faster.
function flyStep(dt){const at=cabs.filter(c=>c.att&&!c.dead&&!c.dummy);if(!at.length||!fl){endFlight();return}
 const a=at[at.length-1],b=at.length>1?at[at.length-2]:null;
 fl.t+=dt;if(fl.t>10){endFlight();return}
 let dx,dy,land=null;const spd=CFG.cable.speed*fl.boost;
 if(!b||fl.deg){const t=b&&Math.hypot(b.ax-P.x,b.ay-P.y)<Math.hypot(a.ax-P.x,a.ay-P.y)?b:a;
  const ex=t.ax-P.x,ey=t.ay-P.y,d=Math.hypot(ex,ey);if(d<=P.r+2){endFlight();return}
  dx=ex/d;dy=ey/d;land=d-(P.r+2)}
 else{dx=fl.dx;dy=fl.dy}
 P.fx=dx;P.fy=dy;const st=spd*dt,step=land!==null?Math.min(st,land):st,ox=P.x,oy=P.y;
 P.x+=dx*step;P.y+=dy*step;
 if(resolve(P,P.r)){P.x=ox;P.y=oy;lose('hit wall');endFlight();return}
 if(land!==null){if(land-step<=.5)endFlight();return}
 const ex=a.ax-b.ax,ey=a.ay-b.ay,s1=ex*(P.y-b.ay)-ey*(P.x-b.ax);
 if(!fl.crossed&&Math.sign(s1)*fl.side<=0)fl.crossed=true;
 if(fl.crossed){const dotAt=(x,y)=>{const u=norm(b.ax-x,b.ay-y),v=norm(a.ax-x,a.ay-y);return u[0]*v[0]+u[1]*v[1]},g1=dotAt(P.x,P.y)-fl.dot0;
  if(g1>=0){const g0=dotAt(ox,oy)-fl.dot0,t=g0<0?-g0/(g1-g0):1;P.x=ox+(P.x-ox)*t;P.y=oy+(P.y-oy)*t;endFlight()}}}
// Auto Tornado Strike: fires when she touches an enemy mid-flight, if energy and its internal cooldown allow. Refund per hero hit.
function tornado(){const t=CFG.t1;if(now<t1cd)return;t1cd=now+t.cd;tor.push({x:P.x,y:P.y,t:0});say(P.x,P.y-44,'Tornado Strike',C.accent)}
// Each touch deals 1 hit (0.35s per-target cooldown). A kill extends the streak and pays base points plus up to +5 streak bonus.
function lose(m){if(streak>0){say(P.x,P.y-44,'Streak lost: '+m,C.danger);streak=0}}
function bumpStreak(){S.bs=Math.max(S.bs||0,streak);if(streak>S.ms){S.ms=streak;try{localStorage.setItem('cableMasterMaxStreak',S.ms)}catch(e){}}}
function hitT(n,fly){T.hp-=n;T.hit=now+.35;if(fly)tornado();
 if(T.hp>0){say(T.x,T.y-T.r-8,'-'+n,C.text);return}
 buzz(25);streak++;bumpStreak();const pts=T.pts+Math.min(streak-1,5);S.score+=pts;S.kills++;
 S.coins+=T.coin;try{localStorage.setItem('cableMasterCoins',S.coins)}catch(e){}say(T.x,T.y-20,(T.n==='Common'?'':T.n+' ')+'+'+pts+'  +'+T.coin+'c',T.col);if(streak>1)say(T.x,T.y-44,'Streak x'+streak,C.accent);
 if(S.kills%3===0){makeObs();resolve(P,P.r)}spawnT()}
function touchCheck(x0,y0,fly){const dx=P.x-x0,dy=P.y-y0,l2=dx*dx+dy*dy,t=l2?clamp(((T.x-x0)*dx+(T.y-y0)*dy)/l2,0,1):0;
 if(Math.hypot(x0+dx*t-T.x,y0+dy*t-T.y)<P.r+T.r){if(now>=T.hit)hitT(1,fly)}}

function segDist(x0,y0,x1,y1,px,py){const dx=x1-x0,dy=y1-y0,l2=dx*dx+dy*dy,t=l2?clamp(((px-x0)*dx+(py-y0)*dy)/l2,0,1):0;return Math.hypot(x0+dx*t-px,y0+dy*t-py)}
function hurt(n,why){if(inv>0||S.phase!=='play')return;inv=1;php=Math.max(0,php-n);buzz(40);say(P.x,P.y-24,'-'+n+' HP',C.danger);lose(why);if(php<=0)end()}
// Projectiles from shooting targets (the Mythic rarity). Hit = 10 HP and breaks the streak; obstacles block shots.
function projStep(dt){
 if(T&&T.shoots&&!cfg.noen){T.fire-=dt;if(T.fire<=0){const [dx,dy]=norm(P.x-T.x,P.y-T.y);proj.push({x:T.x,y:T.y,vx:dx*230,vy:dy*230,r:6});T.fire=2.2}}
 for(const q of proj){q.x+=q.vx*dt;q.y+=q.vy*dt;
  if(q.x<0||q.y<0||q.x>CFG.W||q.y>CFG.H||inObs(q.x,q.y,0)){q.dead=true;continue}
  if(!dash&&inv<=0&&Math.hypot(q.x-P.x,q.y-P.y)<P.r+q.r){q.dead=true;hurt(10,'shot')}}
 proj=proj.filter(q=>!q.dead)}
function update(dt){if(S.phase!=='play'||S.paused)return;now+=dt;
 cdC=Math.max(0,cdC-dt);cdU=Math.max(0,cdU-dt);inv=Math.max(0,inv-dt);
 const px0=P.x,py0=P.y;hooks(dt);const fly0=!dash&&cabs.some(c=>c.att);
 if(dash){const dx=dash.tx-P.x,dy=dash.ty-P.y,d=Math.hypot(dx,dy),st=dash.speed*dt;
  if(d<=st)arrive();else{P.x+=dx/d*st;P.y+=dy/d*st}}
 else if(cabs.some(c=>c.att))flyStep(dt);
 else{let vx=joy.x+((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0),vy=joy.y+((keys.s||keys.arrowdown)?1:0)-((keys.w||keys.arrowup)?1:0);
  const m=Math.hypot(vx,vy);if(m>1){vx/=m;vy/=m}if(m>.05){P.fx=vx/(m>1?1:m);P.fy=vy/(m>1?1:m);const f=norm(vx,vy);P.fx=f[0];P.fy=f[1]}
  P.x+=vx*CFG.speed*dt;P.y+=vy*CFG.speed*dt;resolve(P,P.r)}
 // Streak: breaks the moment there is no active cable or dash, on a wall hit, or on a drifter hit.
 if(streak>0&&!dash&&!cabs.length)lose('Stopped');
 if(T.moving)bounce(T,dt);touchCheck(px0,py0,fly0);
 haz.forEach(h=>{bounce(h,dt);if(!dash&&inv<=0&&segDist(px0,py0,P.x,P.y,h.x,h.y)<P.r+h.r){const fly=cabs.some(c=>c.att);hurt(20,'hit');if(!fly){const [nx,ny]=norm(P.x-h.x,P.y-h.y);P.x+=nx*36;P.y+=ny*36;resolve(P,P.r)}}});
 projStep(dt);
 fx.forEach(f=>f.t+=dt);fx=fx.filter(f=>f.t<.9);tor.forEach(f=>f.t+=dt);tor=tor.filter(f=>f.t<.35);if(cLine){cLine.t-=dt;if(cLine.t<=0)cLine=null}}

function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cw*dpr,ch*dpr);if(P)view();
 ctx.setTransform(dpr*sc,0,0,dpr*sc,dpr*ox,dpr*oy);const W=CFG.W,H=CFG.H;
 ctx.fillStyle=C.floor;ctx.fillRect(0,0,W,H);ctx.strokeStyle=C.grid;ctx.lineWidth=1;ctx.beginPath();
 for(let x=50;x<W;x+=50){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=50;y<H;y+=50){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
 ctx.strokeStyle=C.wall;ctx.lineWidth=6;ctx.strokeRect(0,0,W,H);
 obs.forEach(b=>{ctx.fillStyle=C.wall;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeStyle=C.wallTop;ctx.lineWidth=2;ctx.strokeRect(b.x+1,b.y+1,b.w-2,b.h-2)});
 if(!P)return;
 haz.forEach(h=>{ctx.fillStyle=C.danger;ctx.globalAlpha=.18;ctx.beginPath();ctx.arc(h.x,h.y,h.r+6,0,7);ctx.fill();ctx.globalAlpha=1;ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,7);ctx.fill()});
 proj.forEach(q=>{ctx.fillStyle='#d9689a';ctx.globalAlpha=.25;ctx.beginPath();ctx.arc(q.x,q.y,q.r+4,0,7);ctx.fill();ctx.globalAlpha=1;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill()});
 if(T&&S.phase!=='menu'){ctx.strokeStyle=T.col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(T.x,T.y,T.r,0,7);ctx.stroke();ctx.globalAlpha=now<T.hit?.45:1;ctx.fillStyle=T.col;ctx.beginPath();ctx.arc(T.x,T.y,T.r-7,0,7);ctx.fill();ctx.globalAlpha=1;
  if(T.shoots){if(T.fire<.5){ctx.globalAlpha=.5;ctx.lineWidth=1.5;ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(T.x,T.y);ctx.lineTo(P.x,P.y);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1}
   const r=T.r+5;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(T.x,T.y-r);ctx.lineTo(T.x+r,T.y);ctx.lineTo(T.x,T.y+r);ctx.lineTo(T.x-r,T.y);ctx.closePath();ctx.stroke()}
  if(T.max>1){ctx.lineWidth=4;ctx.beginPath();ctx.arc(T.x,T.y,T.r+6,-Math.PI/2,-Math.PI/2+6.283*T.hp/T.max);ctx.stroke()}
  }
 tor.forEach(f=>{const k=f.t/.35;ctx.globalAlpha=1-k;ctx.strokeStyle=C.accent;ctx.lineWidth=4;ctx.beginPath();ctx.arc(f.x,f.y,CFG.t1.r*(.3+.7*k),0,7);ctx.stroke()});ctx.globalAlpha=1;
 const at2=cabs.filter(c=>c.att).slice(-2),sk=curSkin(),tt=performance.now()/1000;
 cabs.forEach(c=>{const tx=c.att?c.ax:c.ox+c.dx*c.t,ty=c.att?c.ay:c.oy+c.dy*c.t;drawCable(ctx,P.x,P.y,tx,ty,sk,(!c.att||at2.includes(c))?1:.35,tt,3)});ctx.globalAlpha=1;
 if(cLine){ctx.globalAlpha=Math.max(0,cLine.t/.18);ctx.strokeStyle=C.danger;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cLine.x1,cLine.y1);ctx.lineTo(cLine.x2,cLine.y2);ctx.stroke();ctx.globalAlpha=1}
 if(aim&&S.phase==='play'){ctx.strokeStyle=aim.kind==='cable'?C.accent:C.danger;ctx.lineWidth=2;ctx.setLineDash([8,8]);ctx.beginPath();
  if(aim.kind==='cable'){const d=aimDir();ctx.moveTo(P.x,P.y);ctx.lineTo(P.x+d[0]*CFG.cable.range,P.y+d[1]*CFG.cable.range)}else ctx.arc(P.x,P.y,CFG.cut.range,0,7);ctx.stroke();ctx.setLineDash([])}
 if(sw&&sw.drag&&S.phase==='play'){const d=sw.dir,h=rayHit(d[0],d[1],CFG.cable.range),L=h?h.d:CFG.cable.range;ctx.strokeStyle=C.accent;ctx.lineWidth=2;ctx.globalAlpha=.7;ctx.setLineDash([10,8]);ctx.beginPath();ctx.moveTo(P.x,P.y);ctx.lineTo(P.x+d[0]*L,P.y+d[1]*L);ctx.stroke();ctx.setLineDash([]);if(h){ctx.fillStyle=C.accent;ctx.beginPath();ctx.arc(h.x,h.y,5,0,7);ctx.fill()}ctx.globalAlpha=1}
 ctx.globalAlpha=inv>0&&Math.floor(inv*10)%2?.4:1;ctx.fillStyle=C.player;ctx.beginPath();ctx.arc(P.x,P.y,P.r,0,7);ctx.fill();
 ctx.fillStyle=C.accent;ctx.beginPath();ctx.arc(P.x+P.fx*(P.r-3),P.y+P.fy*(P.r-3),5,0,7);ctx.fill();ctx.globalAlpha=1;
 ctx.font='600 17px -apple-system,Segoe UI,Roboto,system-ui,sans-serif';ctx.textAlign='center';fx.forEach(f=>{ctx.globalAlpha=1-f.t/.9;ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y-f.t*40)});ctx.globalAlpha=1}
function aimDir(){return aim.drag?[aim.dx,aim.dy]:(aim.kind==='cable'?autoDir():norm(T.x-P.x,T.y-P.y))}

let lc=S.coins;
function hud(){if(S.coins!==lc){lc=S.coins;const el=$('coinui');el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
 $('mx').textContent=S.ms;$('bs').textContent=Math.max(S.best,S.score);$('sc').textContent=S.score;$('stk').textContent=streak?'x'+streak:'0';$('cn').textContent=S.coins;
 const h=php==null?CFG.hp:php;$('fill').style.width=h/CFG.hp*100+'%';$('fill').style.background=h<30?'var(--danger)':'var(--ok)';$('enT').textContent=Math.ceil(h);
 $('cab').querySelector('.cd').style.height='0%';$('ult').classList.toggle('low',cdU>0);$('ult').querySelector('.cd').style.height=(cdU/(CFG.cut.cd||1)*100)+'%'}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();hud();if(!$('shop').hidden)shopDraw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

// Joystick
const jEl=$('joy'),kn=$('knob');let jid=null;
function jmove(e){const r=jEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.4;
 let dx=e.clientX-cx,dy=e.clientY-cy;const l=Math.hypot(dx,dy);if(l>max){dx*=max/l;dy*=max/l}joy.x=dx/max;joy.y=dy/max;kn.style.transform=`translate(${dx}px,${dy}px)`}
jEl.addEventListener('pointerdown',e=>{jid=e.pointerId;jEl.setPointerCapture(jid);jmove(e)});
jEl.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e)});
const jend=e=>{if(e.pointerId===jid){jid=null;joy.x=joy.y=0;kn.style.transform=''}};
jEl.addEventListener('pointerup',jend);jEl.addEventListener('pointercancel',jend);

// Skill buttons: tap = auto-aim, hold and drag = manual aim
function bindSkill(el,kind){let id=null,cx=0,cy=0;
 el.addEventListener('pointerdown',e=>{if(S.phase!=='play'||S.paused)return;id=e.pointerId;el.setPointerCapture(id);const r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;aim={kind,dx:0,dy:0,drag:false}});
 el.addEventListener('pointermove',e=>{if(e.pointerId!==id||!aim)return;const vx=e.clientX-cx,vy=e.clientY-cy,l=Math.hypot(vx,vy);aim.drag=l>16;if(aim.drag){aim.dx=vx/l;aim.dy=vy/l}});
 el.addEventListener('pointerup',e=>{if(e.pointerId!==id||!aim)return;const d=aimDir();aim=null;id=null;kind==='cable'?cable(d):cut(d)});
 el.addEventListener('pointercancel',()=>{aim=null;id=null})}
bindSkill($('cab'),'cable');bindSkill($('ult'),'cut');

// Split screen: left half = movement (touch anywhere, floating joystick); right half = skills (swipe to fire a cable that way, tap to fire toward the tap). Each touch only controls its own half, so holding a skill button never fires a second cable from the left side.
const SWIPE=24,mid=()=>innerWidth/2;let lj=null;
const ljEnd=()=>{lj=null;joy.x=joy.y=0;kn.style.transform=''};
cv.addEventListener('pointerdown',e=>{if(S.phase!=='play'||S.paused)return;
 if(e.clientX<mid()){if(lj||jid!==null)return;lj={id:e.pointerId,x0:e.clientX,y0:e.clientY};try{cv.setPointerCapture(e.pointerId)}catch(_){}return}
 /* Right half of the arena does nothing: cables are cast only with the Steel Cables button (or Q on a keyboard). */});
cv.addEventListener('pointermove',e=>{
 if(lj&&e.pointerId===lj.id){const max=55;let dx=e.clientX-lj.x0,dy=e.clientY-lj.y0;const l=Math.hypot(dx,dy);if(l>max){dx*=max/l;dy*=max/l}joy.x=dx/max;joy.y=dy/max;const k=jEl.getBoundingClientRect().width*.4/max;kn.style.transform=`translate(${dx*k}px,${dy*k}px)`;return}
 if(sw&&e.pointerId===sw.id){const dx=e.clientX-sw.x0,dy=e.clientY-sw.y0;if(Math.hypot(dx,dy)>SWIPE){sw.drag=true;sw.dir=norm(dx,dy)}}});
cv.addEventListener('pointerup',e=>{if(lj&&e.pointerId===lj.id){ljEnd();return}
 if(!sw||e.pointerId!==sw.id)return;const s=sw;sw=null;if(S.phase!=='play')return;let d;
 if(s.drag)d=s.dir;else{const r=cv.getBoundingClientRect();d=norm((e.clientX-r.left-ox)/sc-P.x,(e.clientY-r.top-oy)/sc-P.y)}cable(d)});
cv.addEventListener('pointercancel',e=>{if(lj&&e.pointerId===lj.id)ljEnd();if(sw&&e.pointerId===sw.id)sw=null});
// Keyboard and mouse
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(S.phase!=='play'||S.paused)return;
 if(k==='q'){let d;if(mouse)d=norm(mouse.x-P.x,mouse.y-P.y);else d=autoDir();cable(d)}
 if(k==='e'||k===' '){e.preventDefault();cut(norm(T.x-P.x,T.y-P.y))}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();mouse={x:(e.clientX-r.left-ox)/sc,y:(e.clientY-r.top-oy)/sc}});

// Menu
$('start').onclick=start;
P={x:150,y:CFG.H/2,r:CFG.R,fx:1,fy:0};
showMenu('menu',false);
</script></body></html>
